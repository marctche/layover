name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm lint

      - run: pnpm test

      - run: pnpm build

  database:
    # Row-level security and invitation tests against a real Supabase stack.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0

      # Starts Postgres and Auth and applies every file in supabase/migrations.
      # Mailpit stays on: the real-login test reads its sign-in code from there.
      - run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,realtime,storage-api,postgres-meta,supavisor

      - run: pnpm test:db
        env:
          LAYOVER_TEST_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres

      # Real email-code logins against the local stack, then row-level security with those sessions.
      - name: pnpm test:auth
        run: |
          eval "$(supabase status -o env)"
          export LAYOVER_TEST_SUPABASE_URL="$API_URL"
          export LAYOVER_TEST_SUPABASE_KEY="${PUBLISHABLE_KEY:-$ANON_KEY}"
          pnpm test:auth

      - if: always()
        run: supabase stop
